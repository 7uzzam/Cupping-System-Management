name: V2-5.9 Final Activation OwnerHub Release Gate
on:
  workflow_dispatch:
  push:
    branches: [cursor/v2-5-9-final-activation-ownerhub-release-c2ea, integration/v2-5-9-final]
  pull_request:
    branches: [cursor/v2-5-8-live-owner-validation-c2ea, cursor/v2-5-8-auth-activation-ui-c2ea, main]
jobs:
  v2-5-9-gate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { vsversion: '2022' }
      - name: npm ci
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node -e "require('better-sqlite3')"
      - run: npm test
      - name: V2-5.9 unit (always)
        run: node tests/baseline/test-v2-5-9-final-activation.js
      - name: Residual closure unit
        run: node tests/baseline/test-v2-5-9-residual-closure.js
      - name: Prior gates
        run: |
          npm run verify:v2-5-8-release-gate
          npm run verify:v2-5-stabilization-release-gate
          npm run verify:v2-5-7-release-gate
      - name: Windows build (real NSIS on windows-2022)
        env: { ELECTRON_BUILDER_DISABLE_CODE_SIGN_WARNING: 'true', CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          node scripts/generate-oauth-config.mjs
          node scripts/generate-license-registries.mjs
          node scripts/generate-brand-assets.mjs
          npm run build:win
      - name: Record Setup EXE SHA-256
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\HijamaManagement-Setup-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE missing after build:win' }
          if ($setup.Length -lt 50MB) { throw "Setup EXE too small ($($setup.Length)) - invalid NSIS" }
          $sha = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          Write-Host "SETUP=$($setup.FullName)"
          Write-Host "SIZE=$($setup.Length)"
          Write-Host "SHA256=$sha"
          "SETUP_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Setup EXE + A-E evidence (silent)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/windows-uat/Install-And-Prove-V259-AE.ps1" -SkipUnit
          # Exit 2 = installed but scenarios still UNVERIFIED (acceptable here)
          if ($LASTEXITCODE -eq 1) { exit 1 }
      - name: A-E runtime harness (records UNVERIFIED until live proof)
        shell: pwsh
        continue-on-error: true
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Hijama Management System\Hijama Management System.exe'
          if (Test-Path $installed) {
            $env:HIJAMA_WINDOWS_INSTALLED = '1'
            $env:HIJAMA_INSTALLED_EXE = $installed
          }
          $env:HIJAMA_SETUP_SHA256 = $env:SETUP_SHA256
          if ($env:SETUP_PATH) { $env:HIJAMA_SETUP_EXE = $env:SETUP_PATH }
          node scripts/windows-uat/v2-5-9-ae-runtime.cjs
          # Exit 2 expected while A-E live proof incomplete
      - name: V2-5.9 release gate (fails while Windows UAT UNVERIFIED)
        run: npm run verify:v2-5-9-release-gate
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v2-5-9-windows-artifacts
          path: |
            dist/*.exe
            dist/win-unpacked/**
            docs/integration-v2-5-9/**
          if-no-files-found: warn
