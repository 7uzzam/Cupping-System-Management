name: V2-5.1 Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/v2-5-1-restore-dr-c2ea
      - integration/v2-5-1-restore-dr
  pull_request:
    branches:
      - integration/hybrid-cloud-owner-v2
      - integration/hybrid-production-candidate

jobs:
  release-gate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '2022'

      - name: npm ci
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node -e "require('better-sqlite3')"

      - name: All automated tests
        run: npm test

      - name: V2-4 regression verifier
        run: npm run verify:v2-4-release-gate

      - name: V2-5.1 restore/DR scenarios
        run: npm run v2-5-1:scenarios

      - name: Generate packaging inputs
        run: |
          node scripts/generate-oauth-config.mjs
          node scripts/generate-license-registries.mjs
          node scripts/generate-brand-assets.mjs

      - name: Windows build
        env:
          ELECTRON_BUILDER_DISABLE_CODE_SIGN_WARNING: 'true'
        run: npm run build:win

      - name: Windows restore/DR runtime UAT
        run: node scripts/windows-uat/v2-5-1-restore-runtime.cjs

      - name: V2-5.1 completion gate
        run: npm run verify:v2-5-1-release-gate

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-5-1-windows-artifacts
          path: |
            dist/*.exe
            dist/win-unpacked/**
            docs/integration-v2-5-1/evidence/**
          if-no-files-found: warn
