name: V2-5.8 Auth Activation UI Gate
on:
  workflow_dispatch:
  push:
    branches: [cursor/v2-5-8-auth-activation-ui-c2ea, integration/v2-5-8-auth-activation-ui]
  pull_request:
    branches: [cursor/v2-5-final-stabilization-c2ea, integration/hybrid-cloud-owner-v2]
jobs:
  activation-gate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { vsversion: '2022' }
      - name: npm ci
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node -e "require('better-sqlite3')"
      - run: npm test
      - run: npm run verify:v2-5-8-release-gate
      - run: npm run verify:v2-5-stabilization-release-gate
      - run: npm run verify:v2-5-7-release-gate
      - run: npm run verify:v2-4-release-gate
      - run: |
          node scripts/generate-oauth-config.mjs
          node scripts/generate-license-registries.mjs
          node scripts/generate-brand-assets.mjs
      - name: Windows build
        env: { ELECTRON_BUILDER_DISABLE_CODE_SIGN_WARNING: 'true' }
        run: npm run build:win
      - name: Index release artifacts after build
        run: node scripts/v2-5-7-release-artifacts.cjs
      - name: Re-run V2-5.8 UAT with Windows artifacts
        run: |
          node scripts/windows-uat/v2-5-8-activation-runtime.cjs
          npm run verify:v2-5-8-release-gate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-5-8-windows-artifacts
          path: |
            dist/*.exe
            dist/win-unpacked/**
            docs/integration-v2-5-8/evidence/**
          if-no-files-found: warn
